name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build share CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          out="share-${GOOS}-${GOARCH}${ext}"
          go build -ldflags="-s -w" -o "$out" ./cmd/share
          echo "BINARY=$out" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: share-${{ matrix.goos }}-${{ matrix.goarch }}
          path: share-*

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build macOS binaries
        run: |
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o share-darwin-amd64 ./cmd/share
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o share-darwin-arm64 ./cmd/share
          lipo -create -output share-darwin share-darwin-amd64 share-darwin-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: share-darwin-universal
          path: |
            share-darwin
            share-darwin-amd64
            share-darwin-arm64

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Windows binaries
        shell: bash
        run: |
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o share-windows-amd64.exe ./cmd/share
          GOOS=windows GOARCH=arm64 go build -ldflags="-s -w" -o share-windows-arm64.exe ./cmd/share

      - uses: actions/upload-artifact@v4
        with:
          name: share-windows
          path: |
            share-windows-amd64.exe
            share-windows-arm64.exe

  release:
    needs: [build, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: share-*
          merge-multiple: true

      - name: Package decoder page
        run: |
          mkdir -p hosting
          cp index.html hosting/
          (cd hosting && zip -r ../instahost-decoder.zip index.html)

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
            instahost-decoder.zip

  deploy-pages:
    needs: [build, build-macos, build-windows]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
